{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CS Department Survey{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'survey.css' %}">
    {% block styles %}
    {% endblock %}
</head>
<body>
    <header class="header p-4">
        <div class="container-fluid d-flex flex-row justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <span class="hello-text ms-2">GEORGE MASON UNIVERSITY</span>
            </div>
        </div>
    </header>
    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="footer mt-4 bg-green text-white text-center p-3">
        <span>© Chaitanya Chaudhari | 2025</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
